<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Market Monitor | 加密市场监控</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            padding: 40px 0;
        }
        
        header h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        
        header p {
            color: #888;
            font-size: 1.1rem;
        }
        
        .last-update {
            text-align: center;
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }
        
        /* 价格卡片 */
        .price-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .price-card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.3s;
        }
        
        .price-card:hover {
            transform: translateY(-5px);
            background: rgba(255,255,255,0.08);
        }
        
        .price-card.btc {
            border-left: 4px solid #f7931a;
        }
        
        .price-card.eth {
            border-left: 4px solid #627eea;
        }
        
        .coin-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        
        .coin-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }
        
        .btc .coin-icon { background: rgba(247, 147, 26, 0.2); }
        .eth .coin-icon { background: rgba(98, 126, 234, 0.2); }
        
        .coin-name {
            font-size: 1.2rem;
            font-weight: 600;
        }
        
        .coin-symbol {
            color: #888;
            font-size: 0.9rem;
        }
        
        .price-main {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .price-change {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 500;
        }
        
        .price-change.up {
            background: rgba(0, 255, 127, 0.15);
            color: #00ff7f;
        }
        
        .price-change.down {
            background: rgba(255, 71, 87, 0.15);
            color: #ff4757;
        }
        
        /* 预测卡片 */
        .prediction-section {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 30px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .section-title {
            font-size: 1.3rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .prediction-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        
        .prediction-card {
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
            padding: 20px;
        }
        
        .prediction-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        
        .prediction-coin {
            font-weight: 600;
            font-size: 1.1rem;
        }
        
        .confidence {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
        }
        
        .confidence.high {
            background: rgba(0, 255, 127, 0.2);
            color: #00ff7f;
        }
        
        .confidence.medium {
            background: rgba(255, 193, 7, 0.2);
            color: #ffc107;
        }
        
        .confidence.low {
            background: rgba(255, 71, 87, 0.2);
            color: #ff4757;
        }
        
        .probability-bars {
            display: flex;
            height: 32px;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 12px;
        }
        
        .prob-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 600;
            transition: width 0.5s ease;
        }
        
        .prob-up {
            background: linear-gradient(90deg, #00b894, #00ff7f);
            color: #000;
        }
        
        .prob-neutral {
            background: linear-gradient(90deg, #636e72, #b2bec3);
            color: #000;
        }
        
        .prob-down {
            background: linear-gradient(90deg, #d63031, #ff4757);
            color: #fff;
        }
        
        .prediction-target {
            color: #888;
            font-size: 0.9rem;
        }
        
        /* 胜率统计 */
        .stats-section {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 30px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .accuracy-main {
            text-align: center;
            padding: 30px;
        }
        
        .accuracy-circle {
            width: 150px;
            height: 150px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #00ff7f var(--accuracy), rgba(255,255,255,0.1) 0);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        .accuracy-circle::before {
            content: '';
            position: absolute;
            width: 120px;
            height: 120px;
            background: #1a1a2e;
            border-radius: 50%;
        }
        
        .accuracy-value {
            position: relative;
            font-size: 2rem;
            font-weight: 700;
        }
        
        .accuracy-label {
            color: #888;
            font-size: 0.9rem;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-top: 20px;
        }
        
        .stat-item {
            text-align: center;
            padding: 16px;
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
        }
        
        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 4px;
        }
        
        .stat-label {
            color: #888;
            font-size: 0.85rem;
        }
        
        /* 传统市场 */
        .traditional-section {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .market-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }
        
        .market-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
        }
        
        .market-name {
            color: #888;
            font-size: 0.9rem;
        }
        
        .market-value {
            text-align: right;
        }
        
        .market-price {
            font-weight: 600;
            font-size: 1.1rem;
        }
        
        .market-change {
            font-size: 0.85rem;
        }
        
        .market-change.up { color: #00ff7f; }
        .market-change.down { color: #ff4757; }
        
        /* 刷新按钮 */
        .refresh-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d4ff, #7b2cbf);
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 212, 255, 0.3);
            transition: transform 0.3s;
        }
        
        .refresh-btn:hover {
            transform: scale(1.1);
        }
        
        .refresh-btn.spinning {
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        /* 响应式 */
        @media (max-width: 768px) {
            header h1 { font-size: 1.8rem; }
            .price-main { font-size: 1.8rem; }
            .stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔮 Crypto Market Monitor</h1>
            <p>实时加密市场监控与AI预测分析</p>
        </header>
        
        <div class="last-update">最后更新: <span id="lastUpdate">--</span></div>
        
        <!-- 价格卡片 -->
        <div class="price-grid">
            <div class="price-card btc">
                <div class="coin-header">
                    <div class="coin-icon">₿</div>
                    <div>
                        <div class="coin-name">Bitcoin</div>
                        <div class="coin-symbol">BTC/USDT</div>
                    </div>
                </div>
                <div class="price-main" id="btcPrice">--</div>
                <span class="price-change" id="btcChange">--</span>
            </div>
            
            <div class="price-card eth">
                <div class="coin-header">
                    <div class="coin-icon">Ξ</div>
                    <div>
                        <div class="coin-name">Ethereum</div>
                        <div class="coin-symbol">ETH/USDT</div>
                    </div>
                </div>
                <div class="price-main" id="ethPrice">--</div>
                <span class="price-change" id="ethChange">--</span>
            </div>
        </div>
        
        <!-- 15分钟预测 -->
        <div class="prediction-section">
            <h2 class="section-title">📈 15分钟走势预测</h2>
            <div class="prediction-grid">
                <div class="prediction-card">
                    <div class="prediction-header">
                        <span class="prediction-coin">BTC</span>
                        <span class="confidence medium" id="btcConfidence">--</span>
                    </div>
                    <div class="probability-bars" id="btcProbBars">
                        <div class="prob-bar prob-up" style="width: 33%">--</div>
                        <div class="prob-bar prob-neutral" style="width: 33%">--</div>
                        <div class="prob-bar prob-down" style="width: 34%">--</div>
                    </div>
                    <div class="prediction-target" id="btcTarget">预测区间: --</div>
                </div>
                
                <div class="prediction-card">
                    <div class="prediction-header">
                        <span class="prediction-coin">ETH</span>
                        <span class="confidence medium" id="ethConfidence">--</span>
                    </div>
                    <div class="probability-bars" id="ethProbBars">
                        <div class="prob-bar prob-up" style="width: 33%">--</div>
                        <div class="prob-bar prob-neutral" style="width: 33%">--</div>
                        <div class="prob-bar prob-down" style="width: 34%">--</div>
                    </div>
                    <div class="prediction-target" id="ethTarget">预测区间: --</div>
                </div>
            </div>
        </div>
        
        <!-- 胜率统计 -->
        <div class="stats-section">
            <h2 class="section-title">🎯 预测胜率统计 (24H)</h2>
            <div class="accuracy-main">
                <div class="accuracy-circle" id="accuracyCircle" style="--accuracy: 0%">
                    <div class="accuracy-value" id="accuracyValue">--%</div>
                </div>
                <div class="accuracy-label">整体准确率</div>
            </div>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-value" id="totalPredictions">--</div>
                    <div class="stat-label">总预测数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="correctPredictions">--</div>
                    <div class="stat-label">正确预测</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="upAccuracy">--%</div>
                    <div class="stat-label">看涨准确率</div>
                </div>
            </div>
        </div>
        
        <!-- 传统市场 -->
        <div class="traditional-section">
            <h2 class="section-title">🌍 传统金融市场</h2>
            <div class="market-grid" id="marketGrid">
                <div class="market-item">
                    <span class="market-name">S&P 500</span>
                    <div class="market-value">
                        <div class="market-price" id="sp500Price">--</div>
                        <div class="market-change" id="sp500Change">--</div>
                    </div>
                </div>
                <div class="market-item">
                    <span class="market-name">NASDAQ</span>
                    <div class="market-value">
                        <div class="market-price" id="nasdaqPrice">--</div>
                        <div class="market-change" id="nasdaqChange">--</div>
                    </div>
                </div>
                <div class="market-item">
                    <span class="market-name">美元指数</span>
                    <div class="market-value">
                        <div class="market-price" id="dxyPrice">--</div>
                        <div class="market-change" id="dxyChange">--</div>
                    </div>
                </div>
                <div class="market-item">
                    <span class="market-name">黄金</span>
                    <div class="market-value">
                        <div class="market-price" id="goldPrice">--</div>
                        <div class="market-change" id="goldChange">--</div>
                    </div>
                </div>
                <div class="market-item">
                    <span class="market-name">原油</span>
                    <div class="market-value">
                        <div class="market-price" id="oilPrice">--</div>
                        <div class="market-change" id="oilChange">--</div>
                    </div>
                </div>
                <div class="market-item">
                    <span class="market-name">VIX恐慌指数</span>
                    <div class="market-value">
                        <div class="market-price" id="vixPrice">--</div>
                        <div class="market-change" id="vixChange">--</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <button class="refresh-btn" onclick="refreshData()" id="refreshBtn">↻</button>
    
    <script>
        // 模拟数据 - 实际使用时从API获取
        const mockData = {
            prices: {
                BTC: { price: 62939.00, change_24h: 2.34 },
                ETH: { price: 1816.26, change_24h: -1.23 }
            },
            predictions: {
                BTC: {
                    up_probability: 62.0,
                    down_probability: 35.0,
                    neutral_probability: 3.0,
                    predicted_range: "$62,400 - $63,500",
                    confidence: "中"
                },
                ETH: {
                    up_probability: 45.0,
                    down_probability: 52.0,
                    neutral_probability: 3.0,
                    predicted_range: "$1,790 - $1,840",
                    confidence: "低"
                }
            },
            accuracy: {
                total: 4,
                correct: 0,
                accuracy: 0.0,
                by_direction: {
                    up: { total: 0, correct: 0, accuracy: 0 },
                    down: { total: 4, correct: 0, accuracy: 0 },
                    neutral: { total: 0, correct: 0, accuracy: 0 }
                }
            },
            traditional: {
                SP500: { price: 6837.75, change_24h: 0.02 },
                NASDAQ: { price: 19234.56, change_24h: 0.36 },
                DXY: { price: 103.45, change_24h: 0.14 },
                GOLD: { price: 2456.78, change_24h: 4.02 },
                OIL: { price: 78.90, change_24h: 2.62 },
                VIX: { price: 14.56, change_24h: -2.34 }
            }
        };
        
        function formatPrice(price) {
            return '$' + price.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }
        
        function formatChange(change) {
            const sign = change >= 0 ? '+' : '';
            return `${sign}${change.toFixed(2)}%`;
        }
        
        function updateUI(data) {
            // 更新时间
            document.getElementById('lastUpdate').textContent = new Date().toLocaleString('zh-CN');
            
            // BTC价格
            document.getElementById('btcPrice').textContent = formatPrice(data.prices.BTC.price);
            const btcChangeEl = document.getElementById('btcChange');
            btcChangeEl.textContent = formatChange(data.prices.BTC.change_24h);
            btcChangeEl.className = 'price-change ' + (data.prices.BTC.change_24h >= 0 ? 'up' : 'down');
            
            // ETH价格
            document.getElementById('ethPrice').textContent = formatPrice(data.prices.ETH.price);
            const ethChangeEl = document.getElementById('ethChange');
            ethChangeEl.textContent = formatChange(data.prices.ETH.change_24h);
            ethChangeEl.className = 'price-change ' + (data.prices.ETH.change_24h >= 0 ? 'up' : 'down');
            
            // BTC预测
            const btcConf = data.predictions.BTC.confidence;
            document.getElementById('btcConfidence').textContent = btcConf + '置信度';
            document.getElementById('btcConfidence').className = 'confidence ' + 
                (btcConf === '高' ? 'high' : btcConf === '中' ? 'medium' : 'low');
            
            const btcBars = document.getElementById('btcProbBars');
            btcBars.innerHTML = `
                <div class="prob-bar prob-up" style="width: ${data.predictions.BTC.up_probability}%">${data.predictions.BTC.up_probability.toFixed(1)}%</div>
                <div class="prob-bar prob-neutral" style="width: ${data.predictions.BTC.neutral_probability}%">${data.predictions.BTC.neutral_probability.toFixed(1)}%</div>
                <div class="prob-bar prob-down" style="width: ${data.predictions.BTC.down_probability}%">${data.predictions.BTC.down_probability.toFixed(1)}%</div>
            `;
            document.getElementById('btcTarget').textContent = '预测区间: ' + data.predictions.BTC.predicted_range;
            
            // ETH预测
            const ethConf = data.predictions.ETH.confidence;
            document.getElementById('ethConfidence').textContent = ethConf + '置信度';
            document.getElementById('ethConfidence').className = 'confidence ' + 
                (ethConf === '高' ? 'high' : ethConf === '中' ? 'medium' : 'low');
            
            const ethBars = document.getElementById('ethProbBars');
            ethBars.innerHTML = `
                <div class="prob-bar prob-up" style="width: ${data.predictions.ETH.up_probability}%">${data.predictions.ETH.up_probability.toFixed(1)}%</div>
                <div class="prob-bar prob-neutral" style="width: ${data.predictions.ETH.neutral_probability}%">${data.predictions.ETH.neutral_probability.toFixed(1)}%</div>
                <div class="prob-bar prob-down" style="width: ${data.predictions.ETH.down_probability}%">${data.predictions.ETH.down_probability.toFixed(1)}%</div>
            `;
            document.getElementById('ethTarget').textContent = '预测区间: ' + data.predictions.ETH.predicted_range;
            
            // 胜率统计
            document.getElementById('accuracyCircle').style.setProperty('--accuracy', data.accuracy.accuracy + '%');
            document.getElementById('accuracyValue').textContent = data.accuracy.accuracy.toFixed(1) + '%';
            document.getElementById('totalPredictions').textContent = data.accuracy.total;
            document.getElementById('correctPredictions').textContent = data.accuracy.correct;
            
            const upAcc = data.accuracy.by_direction.up.accuracy || 0;
            document.getElementById('upAccuracy').textContent = upAcc.toFixed(1) + '%';
            
            // 传统市场
            document.getElementById('sp500Price').textContent = data.traditional.SP500.price.toLocaleString();
            const spChange = document.getElementById('sp500Change');
            spChange.textContent = formatChange(data.traditional.SP500.change_24h);
            spChange.className = 'market-change ' + (data.traditional.SP500.change_24h >= 0 ? 'up' : 'down');
            
            document.getElementById('nasdaqPrice').textContent = data.traditional.NASDAQ.price.toLocaleString();
            const nqChange = document.getElementById('nasdaqChange');
            nqChange.textContent = formatChange(data.traditional.NASDAQ.change_24h);
            nqChange.className = 'market-change ' + (data.traditional.NASDAQ.change_24h >= 0 ? 'up' : 'down');
            
            document.getElementById('dxyPrice').textContent = data.traditional.DXY.price.toFixed(2);
            const dxyChange = document.getElementById('dxyChange');
            dxyChange.textContent = formatChange(data.traditional.DXY.change_24h);
            dxyChange.className = 'market-change ' + (data.traditional.DXY.change_24h >= 0 ? 'up' : 'down');
            
            document.getElementById('goldPrice').textContent = '$' + data.traditional.GOLD.price.toLocaleString();
            const goldChange = document.getElementById('goldChange');
            goldChange.textContent = formatChange(data.traditional.GOLD.change_24h);
            goldChange.className = 'market-change ' + (data.traditional.GOLD.change_24h >= 0 ? 'up' : 'down');
            
            document.getElementById('oilPrice').textContent = '$' + data.traditional.OIL.price.toFixed(2);
            const oilChange = document.getElementById('oilChange');
            oilChange.textContent = formatChange(data.traditional.OIL.change_24h);
            oilChange.className = 'market-change ' + (data.traditional.OIL.change_24h >= 0 ? 'up' : 'down');
            
            document.getElementById('vixPrice').textContent = data.traditional.VIX.price.toFixed(2);
            const vixChange = document.getElementById('vixChange');
            vixChange.textContent = formatChange(data.traditional.VIX.change_24h);
            vixChange.className = 'market-change ' + (data.traditional.VIX.change_24h >= 0 ? 'up' : 'down');
        }
        
        function refreshData() {
            const btn = document.getElementById('refreshBtn');
            btn.classList.add('spinning');
            
            // 模拟刷新 - 实际使用时调用API
            setTimeout(() => {
                updateUI(mockData);
                btn.classList.remove('spinning');
            }, 1000);
        }
        
        // 初始化
        updateUI(mockData);
        
        // 每15秒自动刷新
        setInterval(refreshData, 15000);
    </script>
</body>
</html>
