<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Market Monitor | 加密市场监控</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; background: linear-gradient(90deg, #00d4ff, #7b2cbf); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; font-size: 2.5rem; }
        .subtitle { text-align: center; color: #888; margin-bottom: 10px; }
        .last-update { text-align: center; color: #666; font-size: 0.85rem; margin-bottom: 30px; }
        .price-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .price-card { background: rgba(255,255,255,0.05); border-radius: 16px; padding: 24px; border: 1px solid rgba(255,255,255,0.1); transition: transform 0.3s; }
        .price-card:hover { transform: translateY(-5px); background: rgba(255,255,255,0.08); }
        .price-card.btc { border-left: 4px solid #f7931a; }
        .price-card.eth { border-left: 4px solid #627eea; }
        .price-main { font-size: 2.2rem; font-weight: 700; margin-bottom: 8px; }
        .price-change { display: inline-flex; padding: 4px 12px; border-radius: 20px; font-weight: 500; }
        .price-change.up { background: rgba(0, 255, 127, 0.15); color: #00ff7f; }
        .price-change.down { background: rgba(255, 71, 87, 0.15); color: #ff4757; }
        .prediction-section { background: rgba(255,255,255,0.05); border-radius: 16px; padding: 24px; margin-bottom: 30px; border: 1px solid rgba(255,255,255,0.1); }
        .section-title { font-size: 1.3rem; margin-bottom: 20px; }
        .probability-bars { display: flex; height: 32px; border-radius: 8px; overflow: hidden; margin-bottom: 12px; }
        .prob-bar { display: flex; align-items: center; justify-content: center; font-weight: 600; }
        .prob-up { background: linear-gradient(90deg, #00b894, #00ff7f); color: #000; }
        .prob-down { background: linear-gradient(90deg, #d63031, #ff4757); color: #fff; }
        .stats-section { background: rgba(255,255,255,0.05); border-radius: 16px; padding: 24px; margin-bottom: 30px; border: 1px solid rgba(255,255,255,0.1); }
        .coin-stats { margin-bottom: 30px; padding: 20px; border-radius: 12px; }
        .coin-stats.btc { background: rgba(247, 147, 26, 0.1); border-left: 4px solid #f7931a; }
        .coin-stats.eth { background: rgba(98, 126, 234, 0.1); border-left: 4px solid #627eea; }
        .coin-title { font-size: 1.3rem; margin-bottom: 15px; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 15px; }
        .stat-item { text-align: center; padding: 16px; background: rgba(0,0,0,0.2); border-radius: 12px; }
        .stat-value { font-size: 1.5rem; font-weight: 700; margin-bottom: 4px; }
        .stat-label { color: #888; font-size: 0.85rem; }
        .accuracy-main { text-align: center; padding: 20px; }
        .accuracy-value { font-size: 2.5rem; font-weight: 700; color: #00ff7f; }
        .loading { display: inline-block; width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s ease-in-out infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error { color: #ff4757; text-align: center; padding: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔮 Crypto Market Monitor</h1>
        <p class="subtitle">实时加密市场监控与AI预测分析</p>
        <p class="last-update">最后更新: <span id="lastUpdate">--</span> <span id="loadingIndicator"></span></p>
        
        <div class="price-grid">
            <div class="price-card btc">
                <div style="font-size:1.2rem;font-weight:600;color:#f7931a;">₿ Bitcoin</div>
                <div class="price-main" id="btcPrice"><span class="loading"></span></div>
                <span class="price-change" id="btcChange">--</span>
            </div>
            <div class="price-card eth">
                <div style="font-size:1.2rem;font-weight:600;color:#627eea;">Ξ Ethereum</div>
                <div class="price-main" id="ethPrice"><span class="loading"></span></div>
                <span class="price-change" id="ethChange">--</span>
            </div>
        </div>
        
        <div class="prediction-section">
            <h2 class="section-title">📈 15分钟走势预测</h2>
            
            <div style="margin-bottom: 20px;">
                <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
                    <span>BTC</span>
                    <span id="btcConfidence">置信度: 中</span>
                </div>
                <div class="probability-bars" id="btcProbBars">
                    <div class="prob-bar prob-up" style="width:62%">62% UP</div>
                    <div class="prob-bar prob-down" style="width:38%">38% DOWN</div>
                </div>
                <p style="color:#888;font-size:0.9rem;">目标区间: $62,400 - $63,500</p>
            </div>
            
            <div>
                <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
                    <span>ETH</span>
                    <span id="ethConfidence">置信度: 低</span>
                </div>
                <div class="probability-bars" id="ethProbBars">
                    <div class="prob-bar prob-up" style="width:45%">45% UP</div>
                    <div class="prob-bar prob-down" style="width:55%">55% DOWN</div>
                </div>
                <p style="color:#888;font-size:0.9rem;">目标区间: $1,790 - $1,840</p>
            </div>
        </div>
        
        <div class="stats-section">
            <h2 class="section-title">🎯 预测胜率统计 (24H)</h2>
            
            <div id="statsContainer">
                <div style="text-align:center;padding:40px;"><span class="loading"></span> 加载统计中...</div>
            </div>
        </div>
        
        <div style="text-align:center;color:#666;font-size:0.9rem;margin-top:30px;">
            数据每15秒自动更新 | 预测仅供参考
        </div>
    </div>
    
    <script>
        // API基础URL - 使用CoinGecko公共API
        const COINGECKO_API = 'https://api.coingecko.com/api/v3';
        
        // 格式化价格
        function formatPrice(price) {
            return '$' + price.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }
        
        // 格式化涨跌幅
        function formatChange(change) {
            const sign = change >= 0 ? '+' : '';
            return `${sign}${change.toFixed(2)}%`;
        }
        
        // 获取实时价格 - 直接使用CoinGecko API
        async function fetchPrices() {
            try {
                document.getElementById('loadingIndicator').innerHTML = '<span class="loading"></span>';
                
                const response = await fetch(`${COINGECKO_API}/simple/price?ids=bitcoin,ethereum&vs_currencies=usd&include_24hr_change=true`);
                
                if (!response.ok) {
                    throw new Error('API request failed');
                }
                
                const data = await response.json();
                
                // 更新BTC
                const btcPrice = data.bitcoin.usd;
                const btcChange = data.bitcoin.usd_24h_change;
                document.getElementById('btcPrice').textContent = formatPrice(btcPrice);
                const btcChangeEl = document.getElementById('btcChange');
                btcChangeEl.textContent = formatChange(btcChange);
                btcChangeEl.className = 'price-change ' + (btcChange >= 0 ? 'up' : 'down');
                
                // 更新ETH
                const ethPrice = data.ethereum.usd;
                const ethChange = data.ethereum.usd_24h_change;
                document.getElementById('ethPrice').textContent = formatPrice(ethPrice);
                const ethChangeEl = document.getElementById('ethChange');
                ethChangeEl.textContent = formatChange(ethChange);
                ethChangeEl.className = 'price-change ' + (ethChange >= 0 ? 'up' : 'down');
                
                // 更新时间
                document.getElementById('lastUpdate').textContent = new Date().toLocaleString('zh-CN');
                document.getElementById('loadingIndicator').innerHTML = '';
                
            } catch (error) {
                console.error('获取价格失败:', error);
                document.getElementById('loadingIndicator').textContent = ' (更新失败)';
                
                // 显示错误但不覆盖已有数据
                setTimeout(() => {
                    document.getElementById('loadingIndicator').innerHTML = '';
                }, 3000);
            }
        }
        
        // 获取统计
        async function fetchStats() {
            try {
                const response = await fetch(`${API_BASE}/api/stats`);
                const data = await response.json();
                
                if (data.status === 'ok') {
                    renderStats(data.stats);
                }
            } catch (error) {
                console.error('获取统计失败:', error);
                document.getElementById('statsContainer').innerHTML = 
                    '<div class="error">加载统计失败，请稍后重试</div>';
            }
        }
        
        // 渲染统计
        function renderStats(stats) {
            let html = '';
            
            for (const [symbol, stat] of Object.entries(stats)) {
                const color = symbol === 'BTC' ? '#f7931a' : '#627eea';
                const accuracyColor = stat.accuracy >= 50 ? '#00ff7f' : (stat.accuracy >= 30 ? '#ffc107' : '#ff4757');
                
                html += `
                    <div class="coin-stats ${symbol.toLowerCase()}" style="border-left-color: ${color};">
                        <div class="coin-title" style="color: ${color};">${symbol === 'BTC' ? '₿' : 'Ξ'} ${symbol} 预测统计</div>
                        
                        <div class="accuracy-main">
                            <div class="accuracy-value" style="color: ${accuracyColor};">${stat.accuracy.toFixed(1)}%</div>
                            <div style="color: #888;">整体准确率 (${stat.correct}/${stat.total})</div>
                        </div>
                        
                        <div class="stats-grid">
                            <div class="stat-item" style="border-left: 3px solid #00ff7f;">
                                <div class="stat-value" style="color: #00ff7f;">${stat.up.accuracy.toFixed(1)}%</div>
                                <div class="stat-label">📈 UP<br>(${stat.up.correct}/${stat.up.total})</div>
                            </div>
                            <div class="stat-item" style="border-left: 3px solid #ff4757;">
                                <div class="stat-value" style="color: #ff4757;">${stat.down.accuracy.toFixed(1)}%</div>
                                <div class="stat-label">📉 DOWN<br>(${stat.down.correct}/${stat.down.total})</div>
                            </div>
                            <div class="stat-item" style="border-left: 3px solid #b2bec3;">
                                <div class="stat-value" style="color: #b2bec3;">${stat.neutral.accuracy.toFixed(1)}%</div>
                                <div class="stat-label">➡️ NEUTRAL<br>(${stat.neutral.correct}/${stat.neutral.total})</div>
                            </div>
                        </div>
                    </div>
                `;
            }
            
            document.getElementById('statsContainer').innerHTML = html;
        }
        
        // 初始化
        async function init() {
            await fetchPrices();
            await fetchStats();
        }
        
        // 启动
        init();
        
        // 每15秒自动刷新
        setInterval(fetchPrices, 15000);
        setInterval(fetchStats, 60000); // 统计每分钟刷新一次
    </script>
</body>
</html>
